name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vocal
          POSTGRES_PASSWORD: vocal
          POSTGRES_DB: vocal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vocal -d vocal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Create the test database
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import asyncio

          import httpx
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main() -> None:
              for _ in range(30):
                  try:
                      httpx.get("http://localhost:6333/healthz", timeout=2).raise_for_status()
                      break
                  except Exception:
                      await asyncio.sleep(2)
              else:
                  raise SystemExit("Qdrant did not become ready")

              engine = create_async_engine(
                  "postgresql+asyncpg://vocal:vocal@localhost:5432/vocal",
                  isolation_level="AUTOCOMMIT",
              )
              async with engine.connect() as conn:
                  await conn.execute(text("CREATE DATABASE vocal_test OWNER vocal"))
              await engine.dispose()

          asyncio.run(main())
          PY

      - name: Lint
        working-directory: backend
        run: uv run ruff check . && uv run ruff format --check .

      - name: Test
        working-directory: backend
        env:
          QDRANT_URL: http://localhost:6333
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install, type-check, lint, and build
        working-directory: frontend
        run: npm ci && npx next typegen && npx tsc --noEmit && npm run lint && npm run build
